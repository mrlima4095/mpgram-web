# Serve o MPGram com AllowOverride (o .htaccess do projeto faz o rewrite de /file/)
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Mesmas regras de bloqueio do nginx original do projeto
<Directory "/var/www/html/s">
    Require all denied
</Directory>
<Directory "/var/www/html/docker">
    Require all denied
</Directory>
<Directory "/var/www/html/.git">
    Require all denied
</Directory>

<FilesMatch "^(MadelineProto\.log|api_values\.php|composer\.(json|lock)|\.htaccess)$">
    Require all denied
</FilesMatch>

# Long polling do cliente e uploads grandes (espelha os timeouts do nginx original)
TimeOut 21600
LimitRequestBody 0

# prefork + mod_php: limita o número de workers e recicla processos
# periodicamente (ajuda a conter os vazamentos de memória do MadelineProto)
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers        32
    MaxConnectionsPerChild   500
</IfModule>
